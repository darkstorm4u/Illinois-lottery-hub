name: Deploy and Verify Lottery Hub Preview

on:
  push:
    branches:
      - vercel-blob-backfill-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lottery-hub-vercel-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: lottery-hub-preview
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_EnUXORkKZU3VIsDztfNdR56T
      VERCEL_PROJECT_ID: prj_060pTUCAX2YHhyHTZ3rOZFCbUXoq
    defaults:
      run:
        working-directory: vercel-preview
    steps:
      - name: Check out the isolated preview branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Vercel credential is available
        shell: bash
        run: |
          test -n "${VERCEL_TOKEN:-}" || {
            echo "::error::VERCEL_TOKEN is missing from the lottery-hub-preview environment."
            exit 1
          }

      - name: Create an isolated Preview deployment through the Vercel API
        id: deploy
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function walk(directory) {
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              if (entry.name === 'node_modules' || entry.name === '.vercel') return [];
              const full = path.join(directory, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
          }

          const files = walk('.').map((file) => ({
            file: file.replace(/^\.([/\\])/, '').replaceAll('\\', '/'),
            data: fs.readFileSync(file, 'utf8')
          }));

          const response = await fetch(
            `https://api.vercel.com/v13/deployments?teamId=${encodeURIComponent(process.env.VERCEL_ORG_ID)}`,
            {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${process.env.VERCEL_TOKEN}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                name: 'lottery-hub',
                project: process.env.VERCEL_PROJECT_ID,
                files,
                gitMetadata: {
                  remoteUrl: 'https://github.com/darkstorm4u/Illinois-lottery-hub',
                  commitRef: 'vercel-blob-backfill-preview',
                  commitSha: process.env.GITHUB_SHA,
                  commitMessage: 'Isolated six-game Lottery Hub preview',
                  dirty: false,
                  ci: true,
                  ciType: 'github-actions'
                }
              })
            }
          );

          const result = await response.json();
          if (!response.ok) {
            throw new Error(`Vercel deployment request failed (${response.status}): ${JSON.stringify(result)}`);
          }

          const url = `https://${result.url}`;
          fs.writeFileSync('.preview-deployment.json', JSON.stringify({ id: result.id, url }));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `id=${result.id}\nurl=${url}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Preview URL: ${url}\n`);
          console.log(`Created Preview deployment ${result.id}`);
          NODE

      - name: Wait for the Preview deployment to become ready
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const fs = require('fs');
          const deployment = JSON.parse(fs.readFileSync('.preview-deployment.json', 'utf8'));
          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          for (let attempt = 1; attempt <= 90; attempt += 1) {
            const response = await fetch(
              `https://api.vercel.com/v13/deployments/${deployment.id}?teamId=${encodeURIComponent(process.env.VERCEL_ORG_ID)}`,
              { headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` } }
            );
            const result = await response.json();
            if (!response.ok) throw new Error(`Could not inspect deployment: ${response.status} ${JSON.stringify(result)}`);
            const state = result.readyState || result.state;
            if (state === 'READY') {
              console.log('Preview deployment is READY.');
              process.exit(0);
            }
            if (state === 'ERROR' || state === 'CANCELED') {
              throw new Error(`Preview deployment ended in ${state}.`);
            }
            await wait(3000);
          }
          throw new Error('Timed out waiting for the Preview deployment.');
          NODE

      - name: Backfill and verify all six games
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const fs = require('fs');
          const deployment = JSON.parse(fs.readFileSync('.preview-deployment.json', 'utf8'));

          const envResponse = await fetch(
            `https://api.vercel.com/v10/projects/${process.env.VERCEL_PROJECT_ID}/env?decrypt=true&teamId=${encodeURIComponent(process.env.VERCEL_ORG_ID)}`,
            { headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` } }
          );
          const envPayload = await envResponse.json();
          if (!envResponse.ok) throw new Error(`Could not read Preview configuration: ${envResponse.status}`);

          const appliesToPreview = (item) => Array.isArray(item.target) && item.target.includes('preview');
          const cron = (envPayload.envs || []).find((item) => item.key === 'CRON_SECRET' && appliesToPreview(item))?.value;
          const blob = (envPayload.envs || []).find((item) => item.key === 'BLOB_READ_WRITE_TOKEN' && appliesToPreview(item))?.value;
          if (!cron) throw new Error('CRON_SECRET is missing from Preview.');
          if (!blob) throw new Error('BLOB_READ_WRITE_TOKEN is missing from Preview.');

          const anonymous = await fetch(`${deployment.url}/api/backfill?game=pick3`, { method: 'POST' });
          if (anonymous.status !== 401) {
            throw new Error(`Protected updater returned HTTP ${anonymous.status} without authorization; expected 401.`);
          }

          const games = ['pick3', 'pick4', 'lotto', 'lucky', 'powerball', 'mega'];
          for (const game of games) {
            const response = await fetch(`${deployment.url}/api/backfill?game=${game}`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${cron}` }
            });
            const text = await response.text();
            let result;
            try { result = JSON.parse(text); } catch { result = { raw: text.slice(0, 500) }; }
            if (!response.ok || result.ok !== true) {
              throw new Error(`${game} backfill failed (${response.status}): ${JSON.stringify(result)}`);
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${game}: ${result.rows} rows\n`);
          }

          const verifyResponse = await fetch(`${deployment.url}/api/verify`, { cache: 'no-store' });
          const verify = await verifyResponse.json();
          if (!verifyResponse.ok || verify.ok !== true) {
            throw new Error(`Six-game verification failed (${verifyResponse.status}): ${JSON.stringify(verify)}`);
          }

          for (const game of games) {
            const check = verify.checks?.[game];
            if (!check?.ok) throw new Error(`${game} did not pass stored-history verification.`);
            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              `${game}: ${check.rows} rows, ${check.oldest} through ${check.newest}\n`
            );
          }
          console.log('All six games passed six-month stored-history verification.');
          NODE

      - name: Smoke-check the Preview PWA
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const fs = require('fs');
          const deployment = JSON.parse(fs.readFileSync('.preview-deployment.json', 'utf8'));
          for (const pathname of ['/', '/manifest.webmanifest', '/sw.js', '/api/history']) {
            const response = await fetch(`${deployment.url}${pathname}`, { cache: 'no-store' });
            if (!response.ok) throw new Error(`${pathname} returned HTTP ${response.status}.`);
          }
          console.log('Preview page, manifest, worker, and history API are reachable.');
          NODE
