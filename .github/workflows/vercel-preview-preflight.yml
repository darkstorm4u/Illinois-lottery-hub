name: Vercel Preview Preflight

# This workflow is intentionally limited to the isolated preview branch. It
# reads preview configuration only; it never builds, deploys, promotes, or
# reads production environment values.

on:
  push:
    branches:
      - vercel-blob-backfill-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-preview-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: lottery-hub-preview
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_EnUXORkKZU3VIsDztfNdR56T
      VERCEL_PROJECT_ID: prj_060pTUCAX2YHhyHTZ3rOZFCbUXoq
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check Vercel API credential availability
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN=MISSING"
            echo "A GitHub Actions VERCEL_TOKEN is required before this workflow can read Vercel preview settings."
            exit 2
          fi
          echo "VERCEL_TOKEN=PRESENT"
      - name: Read preview environment key names only
        run: |
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?decrypt=false&teamId=$VERCEL_ORG_ID")"
          if [ "$status_code" != "200" ]; then
            echo "Vercel project environment metadata request failed with HTTP $status_code."
            exit 1
          fi
          echo "Preview environment keys:"
          jq -r '.envs[] | select((.target // []) | index("preview")) | .key' "$response_file" | sort -u
          for key in BLOB_READ_WRITE_TOKEN CRON_SECRET; do
            if jq -e --arg key "$key" '.envs[] | select(.key == $key and ((.target // []) | index("preview")))' "$response_file" >/dev/null; then
              echo "${key}=PRESENT"
            else
              echo "${key}=MISSING"
            fi
          done
